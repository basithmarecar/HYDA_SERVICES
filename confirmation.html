<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation confirmée | HYDA SERVICES</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="pricing-card text-center p-5" style="max-width:700px; width:100%;">

            <div class="mb-4">
                <div class="d-inline-flex justify-content-center align-items-center rounded-circle"
                    style="width:120px;height:120px;background:rgba(34,197,94,.12);">

                    <i class="fas fa-check fa-4x text-success"></i>

                </div>
            </div>

            <span class="section-badge mb-3">
                Réservation validée
            </span>

            <h1 class="fw-bold mt-3 mb-3">
                Merci pour votre confiance !
            </h1>

            <p class="lead text-secondary mb-4">
                Votre demande de réservation a bien été enregistrée.
                <br>
                Notre équipe vous contactera dans les plus brefs délais afin de confirmer votre rendez-vous.
            </p>

            <div class="alert alert-light border rounded-4 mb-4">
                <i class="fa-solid fa-envelope-open-text text-primary me-2"></i>
                Pensez à vérifier vos e-mails ainsi que vos courriers indésirables.
            </div>

            <a href="index.html" class="btn btn-primary-custom">
                <i class="fa-solid fa-house me-2"></i>
                Retour à l'accueil
            </a>

        </div>

    </div>

</body>

</html>
